# Research State — Central Project Tracking
# Copy this template to your project root and fill in as you go.
# Updated by the agent after each experiment and reflection.

project:
  title: ""
  question: ""                    # The core research question
  status: active                  # active | paused | concluded
  started: ""                     # ISO date
  domain: ""                      # e.g., "mechanistic interpretability", "RL training"

literature:
  key_papers: []
  # - id: "liu2025superposition"
  #   title: "Superposition Yields Robust Neural Scaling"
  #   authors: "Liu et al."
  #   year: 2025
  #   relevance: "Proves ETF structure in LM heads"
  open_problems: []               # Gaps identified from literature
  evidence_gaps: []               # What's missing in the field

hypotheses:
  # List of all hypotheses, active and completed
  # - id: H1
  #   statement: "Testable claim with clear prediction"
  #   status: pending             # pending | active | supported | refuted | inconclusive
  #   motivation: "Why this is worth testing"
  #   parent: null                # null for root, parent ID (e.g., H1) for sub-hypotheses
  #   priority: medium            # high | medium | low

# 准备循环总账（跨会话/重启/后端累计；重命名 phase/slug 不清零）
prep:
  prep_turns: 0                  # 距上次有信息量观测的准备轮数
  prep_wall_time_min: 0.0        # 累计准备墙钟（分钟）
  prep_cost: null                # 可取得的 token/费用估计
  last_informative_observation: ""  # 上次有效进展是什么（何时）
  ready_blocker: ""              # 未就绪的具体阻塞 + 解除条件
  next_min_probe: ""             # 就绪后的最小真实 probe 描述
  session_id: null               # 外层循环续接会话 id（按项目持久化）

# 累计预算总账（跨后端连续；换后端不清零——第六轮预算下传机制的落点）
budget:
  unit: "gpu_hours"               # 资源单位（gpu_hours | usd | wall_hours）
  total_cap: null                 # 本研究目标的累计上限
  used: 0.0                       # 已消耗（跨后端合计）
  remaining: null                 # = total_cap - used；null 表示未设上限

# 后端交接日志（每次切换/启动引擎追加一行，不覆盖）
backend_ledger: []
# - timestamp: ""
#   backend: "autoresearch | arbor | autoscientists | forge"
#   handoff: ""                   # 交接时传入的局部预算与停止标准
#   local_cap: null
#   local_used: 0.0
#   note: ""                      # 例如 "该后端在本环境不可用，跳过"

experiments:
  proxy_metric: ""                # What we're optimizing and how to compute it
  # 修复5 KEEP 口径拆分（三处规则统一引用本两字段）：
  eval_baseline: null             # 成果评估对照 = 预注册冻结的原基线
                                  # （KEEP/DISCARD 判定用：候选 > eval_baseline 记改进）
  best_value: null                # 代码保留对照 = 当前最佳实现
                                  # （分支前进/回滚用：候选 < best_value 不覆盖最佳代码）
  total_runs: 0
  trajectory: []
  # - run_id: "run_001"
  #   hypothesis: "H1"
  #   metric_value: null
  #   delta: null                 # Change from baseline
  #   wall_time_min: null
  #   change_summary: ""
  #   timestamp: ""

outer_loop:
  cycle: 0                       # How many outer loop reflections so far
  last_direction: null            # deepen | broaden | pivot | conclude
  last_reflection: ""             # Brief summary of last reflection decision

workspace:
  # Track key resource locations
  findings: "findings.md"
  log: "research-log.md"
  literature_dir: "literature/"
  experiments_dir: "experiments/"
  to_human_dir: "to_human/"
  paper_dir: "paper/"
